  <circle cx="95" cy="415" r="5" fill="#52be80"/>
  <line x1="140" y1="415" x2="220" y2="415" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>
  <rect x="250" y="412" width="100" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="250" y="412" width="60" height="6" rx="3" fill="#52be80"/>

  <!-- Node 4 (Adatbázis) -->
  <rect x="70" y="455" width="300" height="75" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
  <circle cx="105" cy="492" r="14" fill="none" stroke="#94a3b8" stroke-width="4"/>
