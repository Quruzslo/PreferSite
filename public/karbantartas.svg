  <path d="M93 180 L97 185 L106 173" stroke="#52be80" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="130" y1="165" x2="190" y2="165" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="190" x2="230" y2="190" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>

  <!-- Kártya 2 -->
  <rect x="293" y="140" width="213" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="333" cy="180" r="16" fill="#52be80" opacity="0.15"/>
  <circle cx="333" cy="180" r="6" fill="#52be80" />
  <line x1="363" y1="165" x2="423" y2="165" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
