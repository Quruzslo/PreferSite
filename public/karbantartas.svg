  <line x1="485" y1="310" x2="680" y2="310" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  
  <line x1="420" y1="345" x2="470" y2="345" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>
  <line x1="485" y1="345" x2="600" y2="345" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <line x1="420" y1="380" x2="470" y2="380" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>
  <line x1="485" y1="380" x2="710" y2="380" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <line x1="420" y1="415" x2="470" y2="415" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>
  <line x1="485" y1="415" x2="650" y2="415" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <line x1="420" y1="450" x2="470" y2="450" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>
  <line x1="485" y1="450" x2="560" y2="450" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <line x1="420" y1="485" x2="470" y2="485" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>
  <line x1="485" y1="485" x2="690" y2="485" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Villogó terminál kurzor szimuláció -->
  <line x1="420" y1="520" x2="445" y2="520" stroke="#52be80" stroke-width="8" stroke-linecap="round"/>
</svg>
