<svg viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="transparent" />
  
  <!-- Böngésző ablak -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="4" filter="url(#shadow)"/>
  <line x1="20" y1="65" x2="780" y2="65" stroke="#1e293b" stroke-width="4"/>
  <circle cx="45" cy="42.5" r="6" fill="#1e293b" opacity="0.3"/>
  <circle cx="65" cy="42.5" r="6" fill="#1e293b" opacity="0.5"/>
  <circle cx="85" cy="42.5" r="6" fill="#1e293b" opacity="0.8"/>

  <!-- Fejléc / Dashboard Title -->
  <line x1="60" y1="100" x2="250" y2="100" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
