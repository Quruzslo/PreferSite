<svg viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="transparent" />
  
  <!-- Böngésző ablak -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="4" filter="url(#shadow)"/>
  <line x1="20" y1="65" x2="780" y2="65" stroke="#1e293b" stroke-width="4"/>
  <circle cx="45" cy="42.5" r="6" fill="#1e293b" opacity="0.3"/>
  <circle cx="65" cy="42.5" r="6" fill="#1e293b" opacity="0.5"/>
  <circle cx="85" cy="42.5" r="6" fill="#1e293b" opacity="0.8"/>

  <!-- Fejléc: Kereső és Kosár -->
  <rect x="60" y="90" width="100" height="28" rx="6" stroke="#1e293b" stroke-width="4" fill="none" />
  <rect x="250" y="90" width="300" height="28" rx="14" fill="#f1f5f9" />
  <circle cx="270" cy="104" r="5" fill="#94a3b8"/>
  <line x1="285" y1="104" x2="380" y2="104" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Kosár ikon helyőrző -->
  <rect x="680" y="94" width="24" height="20" rx="4" fill="none" stroke="#1e293b" stroke-width="4"/>
  <line x1="685" y1="94" x2="685" y2="88" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="699" y1="94" x2="699" y2="88" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="705" cy="94" r="6" fill="#52be80" stroke="#ffffff" stroke-width="2"/>

  <!-- Hero: Kiemelt termék -->
  <line x1="60" y1="160" x2="300" y2="160" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>
  <line x1="60" y1="200" x2="350" y2="200" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="220" x2="280" y2="220" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <!-- Vásárlás gomb -->
  <rect x="60" y="260" width="140" height="40" rx="20" fill="#52be80" />
  <line x1="85" y1="280" x2="175" y2="280" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Kiemelt termék kép -->
  <rect x="420" y="140" width="320" height="180" rx="12" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>
  <circle cx="580" cy="230" r="40" fill="#e2e8f0"/>
  <rect x="640" y="280" width="80" height="30" rx="6" fill="#1e293b" />
  <line x1="655" y1="295" x2="705" y2="295" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Termékrács (3 termék) -->
  <line x1="60" y1="360" x2="740" y2="360" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>

  <!-- Termék 1 -->
  <rect x="60" y="390" width="200" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="60" y="390" width="200" height="90" rx="8" fill="#e2e8f0"/>
  <line x1="75" y1="500" x2="160" y2="500" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="75" y1="520" x2="120" y2="520" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>

  <!-- Termék 2 -->
  <rect x="300" y="390" width="200" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="300" y="390" width="200" height="90" rx="8" fill="#e2e8f0"/>
  <line x1="315" y1="500" x2="400" y2="500" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="315" y1="520" x2="360" y2="520" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>

  <!-- Termék 3 -->
  <rect x="540" y="390" width="200" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="540" y="390" width="200" height="90" rx="8" fill="#e2e8f0"/>
  <line x1="555" y1="500" x2="640" y2="500" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="555" y1="520" x2="600" y2="520" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>
</svg>
