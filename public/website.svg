<svg viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Árnyék a böngésző ablakhoz -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Háttér (opcionális, most átlátszó, hogy illeszkedjen az oldaladhoz) -->
  <rect width="800" height="600" fill="transparent" />

  <!-- Böngésző ablak keret -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Böngésző felső sáv elválasztó vonal -->
  <line x1="20" y1="65" x2="780" y2="65" stroke="#1e293b" stroke-width="4"/>
  
  <!-- macOS stílusú ablakvezérlő gombok -->
  <circle cx="45" cy="42.5" r="6" fill="#1e293b" opacity="0.3"/>
  <circle cx="65" cy="42.5" r="6" fill="#1e293b" opacity="0.5"/>
  <circle cx="85" cy="42.5" r="6" fill="#1e293b" opacity="0.8"/>

  <!-- ================= HEADER / NAVIGÁCIÓ ================= -->
  <!-- Logó helyőrző -->
  <rect x="60" y="90" width="120" height="28" rx="6" stroke="#1e293b" stroke-width="4" fill="none" />
  <circle cx="74" cy="104" r="6" fill="#1e293b"/>
  <line x1="90" y1="104" x2="165" y2="104" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Menüpontok vonalai -->
  <line x1="530" y1="104" x2="570" y2="104" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="600" y1="104" x2="640" y2="104" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="670" y1="104" x2="710" y2="104" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <!-- Kapcsolat/CTA gomb a menüben -->
  <rect x="730" y="94" width="30" height="20" rx="4" fill="#52be80" opacity="0.2"/>
  <line x1="738" y1="104" x2="752" y2="104" stroke="#52be80" stroke-width="4" stroke-linecap="round"/>

  <!-- ================= HERO SZEKCIÓ ================= -->
  <!-- Főcím (H1) -->
  <line x1="60" y1="170" x2="380" y2="170" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>
  <line x1="60" y1="205" x2="280" y2="205" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Bekezdés (P) -->
  <line x1="60" y1="245" x2="360" y2="245" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="265" x2="390" y2="265" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="285" x2="240" y2="285" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Call to Action gomb -->
  <rect x="60" y="330" width="160" height="50" rx="25" fill="#1e293b" />
  <line x1="95" y1="355" x2="185" y2="355" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Jobb oldali UI Kártya/Kép helyőrző -->
  <rect x="440" y="150" width="300" height="230" rx="12" stroke="#1e293b" stroke-width="4" fill="#f8fafc" />
  <circle cx="475" cy="185" r="12" fill="#e2e8f0"/>
  <line x1="500" y1="180" x2="650" y2="180" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="500" y1="195" x2="580" y2="195" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <!-- Kártya belső tartalom (Egy kis grafikon/vonalháló) -->
  <rect x="470" y="220" width="240" height="130" rx="6" stroke="#e2e8f0" stroke-width="4" fill="none" />
  <polyline points="470,300 520,260 560,280 630,230 710,250" stroke="#52be80" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="520" cy="260" r="4" fill="#52be80"/>
  <circle cx="560" cy="280" r="4" fill="#52be80"/>
  <circle cx="630" cy="230" r="4" fill="#52be80"/>

  <!-- ================= SZOLGÁLTATÁSOK / FUNKCIÓK (3 OSZLOP) ================= -->
  <!-- Elválasztó vonal -->
  <line x1="60" y1="430" x2="740" y2="430" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>

  <!-- 1. Oszlop -->
  <rect x="135" y="460" width="40" height="40" rx="8" fill="#eff6ff" stroke="#52be80" stroke-width="3"/>
  <circle cx="155" cy="480" r="8" fill="#52be80"/>
  <line x1="105" y1="520" x2="205" y2="520" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <line x1="75" y1="545" x2="235" y2="545" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- 2. Oszlop -->
  <rect x="380" y="460" width="40" height="40" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
  <rect x="392" y="472" width="16" height="16" rx="2" fill="#1e293b"/>
  <line x1="350" y1="520" x2="450" y2="520" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <line x1="320" y1="545" x2="480" y2="545" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- 3. Oszlop -->
  <rect x="625" y="460" width="40" height="40" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
  <polygon points="645,470 655,485 635,485" fill="#1e293b" stroke-linejoin="round"/>
  <line x1="595" y1="520" x2="695" y2="520" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <line x1="565" y1="545" x2="725" y2="545" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

</svg>
