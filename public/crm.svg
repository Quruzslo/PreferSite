<svg viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    
    <!-- Vágómaszk a tökéletes, nem kilógó sarkokért -->
    <clipPath id="windowClip">
      <rect x="20" y="20" width="760" height="560" rx="16" />
    </clipPath>
  </defs>

  <!-- Fő ablak alapja és árnyéka -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Belső tartalom a vágómaszk alatt -->
  <g clip-path="url(#windowClip)">
    
    <!-- Böngésző fejléc vonal -->
    <line x1="20" y1="65" x2="780" y2="65" stroke="#1e293b" stroke-width="4"/>
    <circle cx="45" cy="42.5" r="6" fill="#1e293b" opacity="0.3"/>
    <circle cx="65" cy="42.5" r="6" fill="#1e293b" opacity="0.5"/>
    <circle cx="85" cy="42.5" r="6" fill="#1e293b" opacity="0.8"/>

    <!-- Admin Oldalsáv (Most már tökéletesen illeszkedik a bal alsó sarokhoz is!) -->
    <rect x="20" y="67" width="160" height="513" fill="#f8fafc" />
    <line x1="180" y1="65" x2="180" y2="580" stroke="#e2e8f0" stroke-width="4"/>
    
    <!-- Oldalsáv menüpontok (Ikon + Szöveg) -->
    <rect x="40" y="100" width="120" height="30" rx="6" fill="#52be80" opacity="0.15"/>
    <rect x="45" y="107" width="16" height="16" rx="4" fill="#52be80"/>
    <line x1="75" y1="115" x2="140" y2="115" stroke="#52be80" stroke-width="6" stroke-linecap="round"/>

    <rect x="45" y="157" width="16" height="16" rx="4" fill="#94a3b8"/>
    <line x1="75" y1="165" x2="130" y2="165" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    
    <rect x="45" y="207" width="16" height="16" rx="4" fill="#94a3b8"/>
    <line x1="75" y1="215" x2="150" y2="215" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Admin Fejléc -->
    <line x1="220" y1="100" x2="350" y2="100" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="730" cy="100" r="14" fill="#e2e8f0"/>
    <circle cx="690" cy="100" r="8" fill="#cbd5e1"/>

    <!-- KPI Kártyák (3 db) -->
    <rect x="220" y="140" width="160" height="80" rx="8" stroke="#e2e8f0" stroke-width="3" fill="#ffffff"/>
    <line x1="240" y1="165" x2="290" y2="165" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="240" y1="195" x2="320" y2="195" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>

    <rect x="400" y="140" width="160" height="80" rx="8" stroke="#e2e8f0" stroke-width="3" fill="#ffffff"/>
    <line x1="420" y1="165" x2="480" y2="165" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="420" y1="195" x2="490" y2="195" stroke="#52be80" stroke-width="14" stroke-linecap="round"/>

    <rect x="580" y="140" width="160" height="80" rx="8" stroke="#e2e8f0" stroke-width="3" fill="#ffffff"/>
    <line x1="600" y1="165" x2="660" y2="165" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="600" y1="195" x2="700" y2="195" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>

    <!-- Grafikon / Analitika Block -->
    <rect x="220" y="240" width="520" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Oszlopok -->
    <rect x="260" y="320" width="20" height="40" fill="#94a3b8" rx="2"/>
    <rect x="310" y="290" width="20" height="70" fill="#52be80" rx="2"/>
    <rect x="360" y="270" width="20" height="90" fill="#94a3b8" rx="2"/>
    <rect x="410" y="250" width="20" height="110" fill="#52be80" rx="2"/>
    <rect x="460" y="300" width="20" height="60" fill="#94a3b8" rx="2"/>
    <rect x="510" y="260" width="20" height="100" fill="#52be80" rx="2"/>
    <rect x="560" y="330" width="20" height="30" fill="#94a3b8" rx="2"/>
    <rect x="610" y="280" width="20" height="80" fill="#52be80" rx="2"/>

    <!-- Adattábla (Lista nézet) -->
    <line x1="220" y1="420" x2="740" y2="420" stroke="#e2e8f0" stroke-width="4"/>
    
    <!-- Tábla Sor 1 -->
    <circle cx="240" cy="450" r="10" fill="#e2e8f0"/>
    <line x1="270" y1="450" x2="400" y2="450" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <line x1="450" y1="450" x2="550" y2="450" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <rect x="680" y="440" width="60" height="20" rx="10" fill="#52be80" opacity="0.2"/>
    <line x1="695" y1="450" x2="725" y2="450" stroke="#52be80" stroke-width="4" stroke-linecap="round"/>

    <!-- Tábla Sor 2 -->
    <line x1="220" y1="480" x2="740" y2="480" stroke="#f1f5f9" stroke-width="2"/>
    <circle cx="240" cy="510" r="10" fill="#e2e8f0"/>
    <line x1="270" y1="510" x2="380" y2="510" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <line x1="450" y1="510" x2="520" y2="510" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <rect x="680" y="500" width="60" height="20" rx="10" fill="#e2e8f0" />
    <line x1="695" y1="510" x2="725" y2="510" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  </g>

  <!-- Külső keret a tűéles, maszk feletti megjelenésért -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1e293b" stroke-width="4" pointer-events="none"/>
</svg>
