<svg viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="transparent" />
  
  <!-- Böngésző ablak -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="4" filter="url(#shadow)"/>
  <line x1="20" y1="65" x2="780" y2="65" stroke="#1e293b" stroke-width="4"/>
  <circle cx="45" cy="42.5" r="6" fill="#1e293b" opacity="0.3"/>
  <circle cx="65" cy="42.5" r="6" fill="#1e293b" opacity="0.5"/>
  <circle cx="85" cy="42.5" r="6" fill="#1e293b" opacity="0.8"/>

  <!-- Oldalsáv elválasztó -->
  <line x1="220" y1="65" x2="220" y2="580" stroke="#f1f5f9" stroke-width="4"/>

  <!-- Oldalsáv tartalom (Szűrők / Mini naptár) -->
  <rect x="40" y="90" width="140" height="20" rx="4" fill="#f1f5f9" />
  <!-- Hónap választó nyílacskák -->
  <circle cx="50" cy="140" r="12" fill="#52be80" opacity="0.2"/>
  <line x1="60" y1="160" x2="160" y2="160" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="180" x2="130" y2="180" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Lista elemek az oldalsávban -->
  <circle cx="50" cy="230" r="6" fill="#52be80"/>
  <line x1="70" y1="230" x2="170" y2="230" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="50" cy="260" r="6" fill="#e2e8f0"/>
  <line x1="70" y1="260" x2="150" y2="260" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="50" cy="290" r="6" fill="#e2e8f0"/>
  <line x1="70" y1="290" x2="160" y2="290" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Fő tartalom: Naptár fejléc -->
  <line x1="260" y1="100" x2="400" y2="100" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <rect x="640" y="86" width="100" height="28" rx="14" fill="#52be80" />
  <line x1="660" y1="100" x2="720" y2="100" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Naptár Rács (Applikáció UI) -->
  <rect x="260" y="150" width="480" height="220" rx="8" stroke="#e2e8f0" stroke-width="4" fill="#f8fafc"/>
  
  <!-- Oszlopok (Napok) -->
  <line x1="340" y1="150" x2="340" y2="370" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="420" y1="150" x2="420" y2="370" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="500" y1="150" x2="500" y2="370" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="580" y1="150" x2="580" y2="370" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="660" y1="150" x2="660" y2="370" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Foglalt időpontok (Zöld blokkok) -->
  <rect x="265" y="180" width="70" height="40" rx="4" fill="#52be80" opacity="0.8"/>
  <rect x="425" y="240" width="70" height="80" rx="4" fill="#52be80" opacity="0.8"/>
  <rect x="585" y="190" width="70" height="40" rx="4" fill="#1e293b" opacity="0.2"/>

  <!-- Alsó űrlap rész -->
  <line x1="260" y1="410" x2="360" y2="410" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <rect x="260" y="440" width="220" height="30" rx="6" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <rect x="500" y="440" width="240" height="30" rx="6" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <rect x="260" y="490" width="480" height="60" rx="6" stroke="#cbd5e1" stroke-width="3" fill="none"/>
</svg>
